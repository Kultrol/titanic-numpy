[project]
name = "titanic"
version = "0.1.0"
description = "Titanic survival predictions with logistic regression built in NumPy"
readme = "README.md"
authors = [
    { name = "kevin", email = "physicsKev@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.12,<3",
    "rich>=15.0.0",
    "typer>=0.20,<1",
]

[project.scripts]
titanic = "titanic:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
